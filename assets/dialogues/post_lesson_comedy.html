<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; media-src data:; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>课后趣味短剧</title><style>
:root{color-scheme:light dark;--foreground:#182230;--card-foreground:#182230;--card:#fff;--muted:#e6eaf0;--border:#bac4d0;--blue:#4b91d1;--green:#68a878;--orange:#dca45b;--red:#da5b58;--yellow:#e3c64b;font-family:system-ui,sans-serif;background:#f5f7fa;color:var(--foreground)}
*{box-sizing:border-box}body{margin:0;padding:12px}button,input,select{font:inherit}button,select{min-height:44px;max-width:100%;color:inherit;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 12px}button:disabled{opacity:.4}.btn-primary{background:var(--blue);color:#fff}.viz-controls,.viz-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.viz-row{justify-content:space-between}.form-label{display:flex;flex-direction:column;gap:6px;width:100%}.form-select{width:100%}.card{margin:12px 0;padding:4px;background:var(--card);border:1px solid var(--border);border-radius:14px}.text-small{font-size:.85rem}.gv-caption{padding:12px}.gv-caption p{margin:12px 0;overflow-wrap:anywhere;line-height:1.5}#gv-comedy-english{font-size:1.2rem;font-weight:600}.form-check{display:flex;align-items:center;gap:6px;min-height:44px}.form-check-input{width:20px;height:20px}#gv-comedy-status{display:block;margin-top:12px}#gv-comedy-preview[data-reduced-motion="true"] *{transition:none!important;animation:none!important}
@media(prefers-color-scheme:dark){:root{--foreground:#e4eaf2;--card-foreground:#e4eaf2;--card:#202a38;--muted:#526172;--border:#596a80;background:#131c28}}
</style></head><body>
<div id="gv-comedy-preview">
  <div class="viz-controls">
    <label class="form-label">短剧试播
      <select class="form-select" id="gv-comedy-select" aria-label="选择短剧">
        <optgroup label="零基础">
          <option value="Z01">一块也可以</option><option value="Z02">今天的作品</option><option value="Z03">换你来试试</option>
        </optgroup>
        <optgroup label="初级">
          <option value="B01">一份沙拉</option><option value="B02">朋友的价格</option><option value="B03">帮我找一下</option>
        </optgroup>
        <optgroup label="母句型">
          <option value="M01">一起拍张照</option><option value="M02">一起换一下</option><option value="M03">准备出门</option>
        </optgroup>
        <optgroup label="中级">
          <option value="I01">我的选择</option><option value="I02">测试很顺利</option><option value="I03">等你回复</option>
        </optgroup>
      </select>
    </label>
    <span class="text-small" id="gv-comedy-context">母句型 · I need …</span>
  </div>
  <div class="card">
    <div class="gv-stage" id="gv-comedy-stage" role="img" aria-label="艾米与汤姆准备出门">
      <div class="gv-floor" aria-hidden="true"></div>
      <div class="gv-actor gv-amy" id="gv-comedy-amy" data-mood="smile" aria-hidden="true">
        <div class="gv-head"><div class="gv-hair"></div><div class="gv-brows"></div><div class="gv-eyes"></div><div class="gv-mouth"></div></div>
        <div class="gv-body"></div><div class="gv-arm gv-left"></div><div class="gv-arm gv-right"></div><div class="gv-leg gv-left"></div><div class="gv-leg gv-right"></div>
        <span class="gv-name">艾米</span>
      </div>
      <div class="gv-actor gv-tom" id="gv-comedy-tom" data-mood="smile" aria-hidden="true">
        <div class="gv-head"><div class="gv-hair"></div><div class="gv-brows"></div><div class="gv-eyes"></div><div class="gv-mouth"></div></div>
        <div class="gv-body"></div><div class="gv-arm gv-left"></div><div class="gv-arm gv-right"></div><div class="gv-leg gv-left"></div><div class="gv-leg gv-right"></div>
        <span class="gv-name">汤姆</span>
      </div>
      <div id="gv-comedy-props" aria-hidden="true"></div>
      <div class="gv-shutter" aria-hidden="true"></div>
    </div>
    <div class="gv-caption" aria-live="polite" aria-atomic="true">
      <div class="viz-row"><span id="gv-comedy-speaker">开场</span><span class="text-small tabular-nums" id="gv-comedy-progress">0 / 6</span></div>
      <p id="gv-comedy-english" lang="en">I need …</p>
      <p id="gv-comedy-chinese" lang="zh">表达需要</p>
    </div>
  </div>
  <div class="viz-controls gv-playback">
    <button class="btn" type="button" id="gv-comedy-prev" disabled>上一句</button>
    <button class="btn btn-primary" type="button" id="gv-comedy-play">播放</button>
    <button class="btn" type="button" id="gv-comedy-next">下一句</button>
    <label class="form-check"><input class="form-check-input" type="checkbox" id="gv-comedy-subtitles" checked><span class="form-check-label">中文</span></label>
    <label class="form-check"><input class="form-check-input" type="checkbox" id="gv-comedy-sound" checked><span class="form-check-label">声音</span></label>
  </div>
  <span class="text-small" id="gv-comedy-status" role="status">分镜试播 · 临时朗读</span>
</div>
<style>
  #gv-comedy-preview { width:100%; color:var(--foreground); }
  #gv-comedy-preview [hidden] { display:none!important; }
  #gv-comedy-preview .gv-stage { position:relative; height:330px; overflow:hidden; margin-block:4px; }
  #gv-comedy-preview .gv-floor { position:absolute; inset:auto 5% 25px; height:1px; background:var(--border); }
  #gv-comedy-preview .gv-actor { position:absolute; width:88px; height:200px; bottom:41px; transform:translateX(-50%); --left-angle:10deg; --right-angle:-10deg; --head-angle:0deg; --shirt:var(--blue); }
  #gv-comedy-preview .gv-amy { left:26%; }
  #gv-comedy-preview .gv-tom { left:74%; --shirt:var(--green); }
  #gv-comedy-preview .gv-head { position:absolute; top:0; left:13px; width:62px; height:67px; background:var(--muted); border:2px solid var(--foreground); border-radius:45% 45% 44% 44%; transform:rotate(var(--head-angle)); transition:transform 450ms ease; z-index:3; }
  #gv-comedy-preview .gv-hair { position:absolute; left:-3px; top:-4px; width:64px; height:22px; background:var(--foreground); border-radius:45% 48% 12% 12%; }
  #gv-comedy-preview .gv-amy .gv-hair { height:28px; border-radius:48% 48% 12% 25%; transform:rotate(-8deg); }
  #gv-comedy-preview .gv-tom .gv-hair { transform:rotate(5deg); }
  #gv-comedy-preview .gv-eyes { position:absolute; top:31px; left:16px; width:5px; height:6px; background:var(--foreground); border-radius:50%; box-shadow:24px 0 0 var(--foreground); }
  #gv-comedy-preview .gv-brows { position:absolute; top:25px; left:12px; width:12px; height:2px; background:var(--foreground); box-shadow:24px 0 0 var(--foreground); transform:rotate(-3deg); }
  #gv-comedy-preview .gv-mouth { position:absolute; left:23px; top:46px; width:17px; height:8px; border-bottom:2px solid var(--foreground); border-radius:0 0 50% 50%; }
  #gv-comedy-preview .gv-actor[data-mood="surprise"] .gv-mouth { width:10px; height:12px; top:44px; left:26px; border:2px solid var(--foreground); border-radius:50%; }
  #gv-comedy-preview .gv-actor[data-mood="surprise"] .gv-brows { top:23px; transform:rotate(0deg); }
  #gv-comedy-preview .gv-actor[data-mood="think"] .gv-mouth { border-radius:0; height:0; transform:rotate(-8deg); }
  #gv-comedy-preview .gv-actor[data-mood="think"] .gv-brows { transform:rotate(8deg); }
  #gv-comedy-preview .gv-body { position:absolute; top:69px; left:20px; width:48px; height:67px; background:var(--shirt); border-radius:15px 15px 8px 8px; }
  #gv-comedy-preview .gv-arm { position:absolute; top:76px; width:14px; height:66px; background:var(--shirt); border-radius:12px; transform-origin:50% 6px; transition:transform 500ms ease; }
  #gv-comedy-preview .gv-arm::after { content:""; position:absolute; left:1px; bottom:-4px; width:12px; height:15px; background:var(--muted); border:1px solid var(--foreground); border-radius:8px; }
  #gv-comedy-preview .gv-arm.gv-left { left:7px; transform:rotate(var(--left-angle)); }
  #gv-comedy-preview .gv-arm.gv-right { right:7px; transform:rotate(var(--right-angle)); }
  #gv-comedy-preview .gv-leg { position:absolute; top:133px; width:15px; height:47px; background:var(--foreground); border-radius:0 0 6px 6px; }
  #gv-comedy-preview .gv-leg.gv-left { left:24px; }
  #gv-comedy-preview .gv-leg.gv-right { right:24px; }
  #gv-comedy-preview .gv-name { position:absolute; top:186px; width:100%; text-align:center; }
  #gv-comedy-preview .gv-prop { position:absolute; transform:translate(-50%,-50%); z-index:5; transition:left 550ms ease,top 550ms ease,transform 550ms ease; }
  #gv-comedy-preview .gv-book { width:43px; height:55px; background:var(--blue); border:2px solid var(--foreground); border-radius:3px 7px 7px 3px; color:var(--foreground); }
  #gv-comedy-preview .gv-book::before { content:""; position:absolute; left:7px; top:0; bottom:0; width:2px; background:var(--foreground); opacity:.5; }
  #gv-comedy-preview .gv-book::after { content:""; position:absolute; left:16px; right:6px; top:16px; height:2px; background:var(--foreground); box-shadow:0 7px 0 var(--foreground); opacity:.5; }
  #gv-comedy-preview .gv-bag { width:42px; height:47px; background:var(--green); border:2px solid var(--foreground); border-radius:8px 8px 5px 5px; }
  #gv-comedy-preview .gv-bag::before { content:""; position:absolute; left:11px; right:11px; top:-11px; height:10px; border:2px solid var(--foreground); border-bottom:0; border-radius:7px 7px 0 0; }
  #gv-comedy-preview .gv-bag::after { content:""; position:absolute; left:6px; right:6px; bottom:6px; height:15px; border:1px solid var(--foreground); border-radius:4px; }
  #gv-comedy-preview .gv-pen { width:5px; height:40px; background:var(--foreground); border-radius:2px; transform:translate(-50%,-50%) rotate(25deg); }
  #gv-comedy-preview .gv-pen::after { content:""; position:absolute; bottom:-4px; left:0; width:5px; height:5px; background:var(--muted); }
  #gv-comedy-preview .gv-camera { width:52px; height:32px; background:var(--muted); border:2px solid var(--foreground); border-radius:5px; }
  #gv-comedy-preview .gv-camera::before { content:""; position:absolute; width:22px; height:22px; top:3px; left:13px; border:2px solid var(--foreground); border-radius:50%; }
  #gv-comedy-preview .gv-camera::after { content:""; position:absolute; left:7px; top:-6px; width:15px; height:6px; background:var(--foreground); border-radius:2px 2px 0 0; }
  #gv-comedy-preview .gv-photo { width:120px; height:85px; background:var(--card); border:2px solid var(--foreground); box-shadow:3px 3px 0 color-mix(in srgb,var(--foreground) 15%,transparent); }
  #gv-comedy-preview .gv-photo .gv-book { position:absolute; width:30px; height:39px; top:17px; left:16px; }
  #gv-comedy-preview .gv-photo .gv-bag { position:absolute; width:29px; height:33px; top:23px; right:16px; }
  #gv-comedy-preview .gv-photo .gv-portrait { position:absolute; width:28px; height:32px; top:19px; background:var(--muted); border:2px solid var(--foreground); border-radius:45%; }
  #gv-comedy-preview .gv-portrait::before { content:""; position:absolute; top:10px; left:6px; width:3px; height:3px; background:var(--foreground); box-shadow:10px 0 0 var(--foreground); border-radius:50%; }
  #gv-comedy-preview .gv-portrait::after { content:""; position:absolute; top:23px; left:2px; width:22px; height:18px; background:var(--blue); border-radius:5px; z-index:-1; }
  #gv-comedy-preview .gv-portrait:first-child { left:20px; }
  #gv-comedy-preview .gv-portrait:last-child { right:20px; }
  #gv-comedy-preview .gv-portrait:last-child::after { background:var(--green); }
  #gv-comedy-preview .gv-shutter { position:absolute; inset:0; pointer-events:none; background:var(--card); opacity:0; }
  #gv-comedy-preview .gv-stage[data-flash="true"] .gv-shutter { animation:gv-shutter 600ms ease-out; z-index:8; }
  #gv-comedy-preview .gv-mail { width:156px; min-height:101px; background:var(--card); border:2px solid var(--foreground); border-radius:5px; padding:8px 10px; }
  #gv-comedy-preview .gv-mail-top { margin-bottom:9px; display:flex; justify-content:space-between; align-items:center; }
  #gv-comedy-preview .gv-mail-line { width:100%; height:3px; margin-block:6px; background:var(--border); }
  #gv-comedy-preview .gv-mail-line:last-of-type { width:68%; }
  #gv-comedy-preview .gv-mail-attachment { display:flex; gap:5px; align-items:center; padding-top:7px; border-top:1px solid var(--border); }
  #gv-comedy-preview .gv-mail svg { width:16px; height:16px; }
  #gv-comedy-preview .gv-document { width:35px; height:45px; background:var(--card); border:2px solid var(--foreground); border-radius:3px; }
  #gv-comedy-preview .gv-document::before { content:""; position:absolute; left:6px; top:11px; width:19px; height:2px; background:var(--foreground); box-shadow:0 7px 0 var(--foreground),0 14px 0 var(--foreground); opacity:.5; }
  #gv-comedy-preview .gv-calendar { width:36px; height:42px; background:var(--card); border:2px solid var(--foreground); border-radius:4px; display:grid; place-items:center; }
  #gv-comedy-preview .gv-calendar::before { content:""; position:absolute; top:0; left:0; right:0; height:8px; background:var(--orange); }
  #gv-comedy-preview .gv-caption { min-height:123px; padding-top:4px; }
  #gv-comedy-preview .gv-caption .viz-row { justify-content:space-between; }
  #gv-comedy-preview #gv-comedy-english { font-weight:500; overflow-wrap:anywhere; margin-block:10px 6px; }
  #gv-comedy-preview #gv-comedy-chinese { margin-block:6px 0; overflow-wrap:anywhere; }
  #gv-comedy-preview .gv-playback { margin-block:12px 6px; }
  #gv-comedy-preview .gv-actor { transition:left 500ms ease,bottom 450ms ease,transform 450ms ease; transform:translateX(-50%) rotate(var(--tilt,0deg)); }
  #gv-comedy-preview .gv-actor[data-seated="true"] .gv-leg { height:28px; transform:rotate(-75deg); transform-origin:50% 0; }
  #gv-comedy-preview .gv-chair { width:47px; height:38px; border:2px solid var(--foreground); border-top:0; border-radius:0 0 5px 5px; z-index:1; }
  #gv-comedy-preview .gv-chair::before { content:""; position:absolute; top:-29px; left:0; right:0; height:31px; background:var(--muted); border:2px solid var(--foreground); border-radius:7px 7px 0 0; }
  #gv-comedy-preview .gv-chair::after { content:""; position:absolute; left:0; right:0; top:4px; height:7px; background:var(--foreground); }
  #gv-comedy-preview .gv-cookie-group { width:76px; min-height:40px; display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:4px; }
  #gv-comedy-preview .gv-cookie { width:20px; height:20px; border:1px solid var(--foreground); border-radius:50%; background:radial-gradient(circle at 33% 33%,var(--foreground) 1px,transparent 2px),radial-gradient(circle at 68% 62%,var(--foreground) 1px,transparent 2px),var(--orange); }
  #gv-comedy-preview .gv-big-cookie { width:99px; height:99px; border:2px solid var(--foreground); border-radius:50%; background:radial-gradient(circle at 33% 33%,var(--foreground) 4px,transparent 5px),radial-gradient(circle at 68% 62%,var(--foreground) 4px,transparent 5px),radial-gradient(circle at 33% 75%,var(--foreground) 4px,transparent 5px),var(--orange); }
  #gv-comedy-preview .gv-canvas { width:70px; height:94px; border:2px solid var(--foreground); background:var(--card); padding:8px; display:flex; flex-direction:column; gap:12px; justify-content:center; }
  #gv-comedy-preview .gv-stripe { height:10px; background:var(--paint,var(--red)); transform:rotate(-6deg); }
  #gv-comedy-preview .gv-stains { width:41px; height:40px; display:flex; flex-wrap:wrap; justify-content:center; gap:3px; }
  #gv-comedy-preview .gv-stain { width:15px; height:15px; border-radius:35% 60% 35% 45%; background:var(--paint); }
  #gv-comedy-preview .gv-brush { width:6px; height:49px; background:var(--foreground); border-radius:3px; }
  #gv-comedy-preview .gv-brush::before { content:""; position:absolute; top:-8px; left:-4px; width:14px; height:15px; background:var(--paint,var(--red)); border:1px solid var(--foreground); border-radius:3px 3px 50% 50%; }
  #gv-comedy-preview .gv-cue,#gv-comedy-preview .gv-price { background:var(--card); border:2px solid var(--foreground); border-radius:4px; padding:6px 9px; white-space:nowrap; }
  #gv-comedy-preview .gv-salad { width:65px; height:28px; background:var(--muted); border:2px solid var(--foreground); border-radius:50%; display:flex; align-items:center; justify-content:center; gap:1px; }
  #gv-comedy-preview .gv-leaf { display:inline-block; width:17px; height:13px; background:var(--green); border:1px solid var(--foreground); border-radius:65% 10% 65% 10%; }
  #gv-comedy-preview .gv-cup { width:27px; height:34px; border:2px solid var(--foreground); border-radius:3px 3px 7px 7px; background:linear-gradient(transparent 28%,var(--drink,var(--muted)) 28%); }
  #gv-comedy-preview .gv-cup::after { content:""; position:absolute; right:-10px; top:7px; width:9px; height:16px; border:2px solid var(--foreground); border-left:0; border-radius:0 50% 50% 0; }
  #gv-comedy-preview .gv-cup span { position:absolute; width:75px; text-align:center; left:-22px; top:39px; }
  #gv-comedy-preview .gv-stage[data-scene="M02"] .gv-cup span { width:54px; left:-12px; background:var(--card); color:var(--card-foreground); }
  #gv-comedy-preview .gv-burger { width:67px; height:46px; border-radius:40% 40% 18% 18%; border:2px solid var(--foreground); background:linear-gradient(var(--orange) 0 38%,var(--green) 38% 49%,var(--foreground) 49% 67%,var(--orange) 67%); }
  #gv-comedy-preview .gv-burger .gv-leaf { position:absolute; left:20px; top:-6px; transform:rotate(15deg); }
  #gv-comedy-preview .gv-shirt { width:56px; height:61px; background:var(--blue); clip-path:polygon(25% 0,40% 0,50% 12%,60% 0,75% 0,100% 25%,80% 40%,72% 30%,72% 100%,28% 100%,28% 30%,20% 40%,0 25%); }
  #gv-comedy-preview .gv-phone { width:20px; height:37px; border:2px solid var(--foreground); border-radius:4px; background:var(--card); }
  #gv-comedy-preview .gv-phone::before { content:""; position:absolute; left:3px; right:3px; top:4px; bottom:6px; background:var(--blue); opacity:.4; }
  #gv-comedy-preview .gv-phone::after { content:""; position:absolute; width:3px; height:3px; left:7px; bottom:1px; background:var(--foreground); border-radius:50%; }
  #gv-comedy-preview .gv-choices { width:138px; background:var(--card); border:2px solid var(--foreground); padding:7px 10px; }
  #gv-comedy-preview .gv-choice-row { margin-block:5px; display:flex; justify-content:space-between; }
  #gv-comedy-preview .gv-cake { width:41px; height:31px; background:linear-gradient(var(--card) 0 15%,var(--orange) 15% 43%,var(--card) 43% 58%,var(--orange) 58%); border:2px solid var(--foreground); border-radius:5px 5px 0 0; }
  #gv-comedy-preview .gv-cake::before { content:""; position:absolute; left:18px; top:-10px; width:3px; height:9px; background:var(--foreground); }
  #gv-comedy-preview .gv-device { width:60px; height:52px; background:var(--muted); border:2px solid var(--foreground); border-radius:6px; display:grid; place-items:center; }
  #gv-comedy-preview .gv-device::before { content:""; position:absolute; left:6px; top:7px; width:7px; height:7px; border-radius:50%; background:var(--green); }
  #gv-comedy-preview .gv-device svg { width:23px; height:23px; }
  #gv-comedy-preview .gv-photo .gv-portrait { z-index:1; }
  #gv-comedy-preview .gv-photo-label { position:absolute; bottom:1px; width:100%; text-align:center; }
  #gv-comedy-preview .gv-mini { position:absolute; top:10px; width:34px; height:50px; }
  #gv-comedy-preview .gv-mini-a { left:13px; }
  #gv-comedy-preview .gv-mini-t { right:13px; }
  #gv-comedy-preview .gv-mini-head { position:absolute; left:4px; top:0; width:25px; height:27px; background:var(--muted); border:2px solid var(--foreground); border-radius:45%; }
  #gv-comedy-preview .gv-mini-head::before { content:""; position:absolute; top:-2px; left:-2px; right:-2px; height:8px; background:var(--foreground); border-radius:45% 45% 0 0; }
  #gv-comedy-preview .gv-mini-head::after { content:""; position:absolute; left:5px; top:12px; width:3px; height:3px; border-radius:50%; background:var(--foreground); box-shadow:11px 0 0 var(--foreground); }

    #gv-comedy-preview .gv-prop,#gv-comedy-preview .gv-arm,#gv-comedy-preview .gv-head { transition:none; }

      if(step===8){pose(ui.amy,10,-50,'smile',8);pose(ui.tom,50,-10,'smile',-8);}
    } else if(scene==='I02') {
      prop('device',56,247).innerHTML='<i data-icon="power"></i>';
      prop('testing',37,235,step!==3&&step!==5).innerHTML='<div class="gv-choice-row">电源<span>✓</span></div><div class="gv-choice-row">数据<span>□</span></div><div class="gv-choice-row">功能<span>□</span></div>';
      if(step===1||step===3)pose(ui.tom,55,-10,'smile',-8);
      if(step===2||step===4)pose(ui.amy,10,-60,'think',8);
      if(step===5)pose(ui.tom,65,-10,'smile',-8);
      if(step===6||step===7){pose(ui.amy,10,-60,'smile',8);pose(ui.tom,50,-10,'surprise',-8);}
      if(step===8){pose(ui.amy,10,-60,'smile',8);pose(ui.tom,60,-10,'smile',-8);}
      renderIcons();
    }
    const line=payload.lines[scene]?.[Math.min(count-1,Math.max(0,currentStep-1))];
    const endings={Z01:'汤姆只拿出一块很大的饼干，两人准备分享。',Z02:'艾米罩衣也染上红黄蓝，画家和作品一起展示。',Z03:'指挥者也坐下来，两人休息。',B01:'汤姆只取一片沙拉放进自带汉堡，艾米把整盘沙拉推给他。',B02:'艾米拿出两人小时候的合照，汤姆终于给出朋友价。',B03:'汤姆发现自己正在使用寻找的手机。',M02:'两人交换两次又回到原位，最后只由艾米交换一次。',M03:'艾米把书和笔装进包，两人准备出门。',M01:'两人放下书和包，重新拍到两张笑脸。',I01:'艾米把课后蛋糕放到选择清单最上面。',I02:'两人从电源检查继续进行真正的系统测试。',I03:'艾米补上遗漏的日程附件，汤姆准备确认。'};
    ui.stage.setAttribute('aria-label',step===0?'艾米与汤姆：'+ui.select.selectedOptions[0].textContent:step===8?endings[scene]:line?.action||'角色停顿与反应');
  }
  const titles={"Z01": ["一块也可以", "One Is Enough"], "Z02": ["今天的作品", "Today's Artwork"], "Z03": ["换你来试试", "Your Turn"], "B01": ["一份沙拉", "A Salad"], "B02": ["朋友的价格", "The Friend Price"], "B03": ["帮我找一下", "Help Me Find It"], "M01": ["一起拍张照", "A Photo Together"], "M02": ["一起换一下", "A Little Swap"], "M03": ["准备出门", "Ready to Go"], "I01": ["我的选择", "My Choice"], "I02": ["测试很顺利", "The Test Went Well"], "I03": ["等你回复", "Waiting for Your Reply"]};
  function notify(status){
    if(!['ready','completed','error'].includes(status))return;
    try{window.ComedyBridge?.notify(status);}catch{}
  }
  const text=(zh,en)=>english?en:zh;
  function localizeProps(){
    const labels={'周五':'Fri','日程':'Schedule','日程.pdf':'schedule.pdf','附件 · 0':'Files: 0','8 美元':'$8','10 美元':'$10','小时候':'Childhood','茶':'Tea','牛奶':'Milk','蛋糕':'Cake','线上课':'Online','1 小时':'1 hour','晚间课':'Evening','电源':'Power','数据':'Data','功能':'Checks'};
    const walker=document.createTreeWalker(ui.props,NodeFilter.SHOW_TEXT);
    let node;while((node=walker.nextNode())){
      const key=english?node.textContent:Object.keys(labels).find(key=>labels[key]===node.textContent);
      if(key&&Object.hasOwn(labels,key))node.textContent=english?labels[key]:key;
    }
  }
  function render(){
    ui.select.value=scene;ui.context.textContent=english?titles[scene][1]:themes[scene][0];renderStage(step);localizeProps();
    const count=lineCount();const line=step>=1?payload.lines[scene]?.[Math.min(step-1,count-1)]:null;
    ui.speaker.textContent=step===0?text('开场','Opening'):step===endStep()?text('收尾','Ending'):step===count+1?text('角色反应','Reaction'):english?(line?.speaker==='艾米'?'Amy':'Tom'):line?.speaker||'分镜';
    ui.progress.textContent=Math.min(step,count)+' / '+count;
    ui.english.textContent=line?.english||themes[scene][1];ui.chinese.textContent=line?.chinese||themes[scene][2];
    ui.english.hidden=step===endStep();ui.chinese.hidden=!ui.subtitles.checked||step===endStep();
    ui.prev.disabled=step===0;ui.next.disabled=step===endStep();
    ui.play.textContent=playing?text('暂停','Pause'):step===endStep()?text('重播','Replay'):step>0?text('继续播放','Play'):text('播放','Play');
    ui.status.textContent=step===endStep()?text('演出结束','Finished'):text('离线演出','Offline playback');
    ui.prev.textContent=text('上一句','Previous line');ui.next.textContent=text('下一句','Next line');
    ui.subtitles.nextElementSibling.textContent=text('中文字幕','Chinese subtitles');ui.sound.nextElementSibling.textContent=text('声音','Sound');
    root.querySelector('.form-label').firstChild.textContent=text('选择短剧','Choose a comedy');
    ui.select.setAttribute('aria-label',text('选择短剧','Choose a comedy'));
    root.querySelectorAll('option').forEach(option=>option.textContent=titles[option.value][english?1:0]);
    root.querySelectorAll('optgroup').forEach((group,i)=>group.label=english?['Starter','Beginner','Mother Pattern','Intermediate'][i]:['零基础','初级','母句型','中级'][i]);
    root.querySelector('.gv-amy .gv-name').textContent=english?'Amy':'艾米';root.querySelector('.gv-tom .gv-name').textContent=english?'Tom':'汤姆';
    ui.stage.setAttribute('aria-label',text('艾米与汤姆的动画短剧','An animated comedy with Amy and Tom'));
  }
  function stop(){
    generation++;clearTimeout(timer);timer=null;
    if(player){player.onended=null;player.onerror=null;player.pause();player.removeAttribute('src');player.load();player=null;}
  }
  function pause(){stop();playing=false;render();}
  function fail(){pause();ui.status.textContent=text('音频无法播放，请重试','Audio could not play. Please retry.');notify('error');}
  function schedule(){
    stop();if(!playing)return;const token=generation;
    const advance=()=>{
      if(token!==generation||!playing)return;
      if(step===endStep()){pause();notify('completed');return;}
      step++;render();schedule();
    };
    if(step===0||step===lineCount()+1||step===endStep()){timer=setTimeout(advance,step===lineCount()+1?1500:step===endStep()?1100:650);return;}
    const line=payload.lines[scene]?.[step-1];
    const finish=()=>{if(token!==generation||!playing)return;clearTimeout(timer);timer=setTimeout(advance,step===lineCount()?650:400);};
    if(ui.sound.checked&&line&&payload.audio[line.recording]){
      player=new Audio(payload.audio[line.recording]);player.onended=finish;
      player.onerror=()=>{if(token===generation)fail();};
      timer=setTimeout(()=>{if(token===generation)fail();},Math.max(7000,(line.duration+3)*1000));
      player.play().catch(()=>{if(token===generation)fail();});
    }else timer=setTimeout(advance,(line?.duration||3)*1000+400);
  }
  function play(){if(step===endStep())step=0;playing=true;render();notify('ready');schedule();}
  function replay(){pause();step=0;play();}
  function configure(config){
    if(!config||typeof config!=='object'||!Object.hasOwn(payload.lines,config.scene)||typeof config.english!=='boolean'||typeof config.reducedMotion!=='boolean'||typeof config.chinese!=='boolean')return false;
    pause();scene=config.scene;step=0;english=config.english;reducedMotion=config.reducedMotion;
    ui.subtitles.checked=config.chinese;root.dataset.reducedMotion=String(reducedMotion);document.documentElement.lang=english?'en':'zh';render();return true;
  }
  window.ComedyPlayer=Object.freeze({configure,play,pause,replay,stop:pause});
  ui.select.addEventListener('change',()=>{if(!Object.hasOwn(payload.lines,ui.select.value))return;pause();scene=ui.select.value;step=0;render();notify('ready');});
  ui.play.addEventListener('click',()=>playing?pause():play());
  function move(delta){pause();step=Math.max(0,Math.min(endStep(),step+delta));render();if(step===endStep())notify('completed');}
  ui.prev.addEventListener('click',()=>move(-1));ui.next.addEventListener('click',()=>move(1));
  ui.subtitles.addEventListener('change',render);ui.sound.addEventListener('change',()=>{if(playing)schedule();render();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
  window.addEventListener('pagehide',pause);
  render();notify('ready');
})();
</script>
